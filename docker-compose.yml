services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: excel-import-laravel-app:latest
    working_dir: /var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: excel
      DB_USERNAME: excel
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      SEED_DEMO: "true"
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      db:
        condition: service_healthy

  queue:
    image: excel-import-laravel-app:latest
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--queue=imports", "--sleep=3", "--tries=3"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: excel
      DB_USERNAME: excel
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    volumes:
      - ./:/var/www/html:delegated
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    ports:
      - "5173:5173"
    environment:
      VITE_DEV_SERVER_URL: http://localhost:5173
    volumes:
      - ./:/var/www/html:delegated

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: excel
      MYSQL_USER: excel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      retries: 3
      timeout: 5s

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
